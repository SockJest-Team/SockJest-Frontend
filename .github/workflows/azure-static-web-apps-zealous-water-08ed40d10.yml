name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Build And Deploy to Azure
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ZEALOUS_WATER_08ED40D10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          
          app_location: "/"        
          api_location: ""         
          output_location: ""      
          
        env:
          NEXT_PUBLIC_API_URL: https://livebidapi-cwebcvfvh3d9f2hj.brazilsouth-01.azurewebsites.net/api
          NEXT_PUBLIC_WS_URL: https://livebidapi-cwebcvfvh3d9f2hj.brazilsouth-01.azurewebsites.net/
          NEXT_PUBLIC_API_URL_BACKUP: https://sockjest-backend.onrender.com/api
          NEXT_PUBLIC_WS_URL_BACKUP: https://sockjest-backend.onrender.com/

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ZEALOUS_WATER_08ED40D10 }}
          action: "close" # Cierra los entornos de sandbox de los Pull Requests
